# Content for the /misc/ page.
#
# Photos are discovered automatically from the folders named below, so adding a
# picture is just: drop the file in, run scripts/optimize_misc_photos.py, done.
# Everything here is the wording that wraps around them.

intro: >
  Outside work and research, I am interested in a myriad of hobbies - check out a few of them below! My list of hobbies will keep growing...

# The hobby chips at the top of the page.
hobby_groups:
  - label: "Sports"
    icon: "🥾"
    items:
      - Running
      - Hiking
      - Climbing
      - Skiing
  - label: "Wellness"
    icon: "🌿"
    items:
      - Pilates &amp; yoga
      - Watercolor (self-taught)
      - Crocheting (self-taught)
  - label: "Music"
    icon: "🎻"
    items:
      - Cello (classically trained since 8)
  - label: "Kitchen"
    icon: "🥐"
    items:
      - Baking
      - Cooking

# Each gallery is one hobby. A hobby with a single body of work has one series
# pointing at its own folder; a hobby that accumulates trips has one series per
# subfolder. `folder` is relative to images/misc/.
galleries:
  - key: hiking
    title: Hiking
    # blurb: Trails collected one weekend at a time.
    series:
      - folder: hiking/sequoia2026
        title: Sequoia National Park (2026)
        place: California
        year: 2026
      - folder: hiking/atlanta2026
        title: Atlanta (2026)
        place: Georgia
        year: 2026

  - key: baking
    title: Baking
    # blurb: Weekend experiments, usually photographed next to whatever flowers were on the counter.
    series:
      - folder: baking
        # title: Out of the oven
        place: ""
        year: ""

# Optional per-photo captions, keyed by path under images/misc/.
# Anything missing just shows up without a caption.
captions:
